[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "VCU-Bridge"
version = "0.1.0"
description = "Visual Comprehension Understanding Bridge"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Ming", email = "mingzh.cs@gmail.com"}
]

[tool.setuptools.packages.find]
where = ["."]
include = ["Evaluation*", "Instruction_Data_Generation_Pipeline*"]
